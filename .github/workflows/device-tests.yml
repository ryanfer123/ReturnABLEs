name: Android device tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            device_test_result=0
            ./gradlew connectedDebugAndroidTest --no-daemon || device_test_result=$?
            mkdir -p app/build/device-screenshots
            adb pull /sdcard/Android/data/com.returnables.app/files/qa-screenshots app/build/device-screenshots || true
            adb shell am start -W -n com.returnables.app/.MainActivity
            adb shell uiautomator dump /sdcard/returnables-home.xml
            adb exec-out screencap -p > app/build/device-screenshots/native-home.png
            exit "$device_test_result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-screenshots/
